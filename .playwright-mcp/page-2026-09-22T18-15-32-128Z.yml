    - generic [ref=e219]:
      - generic [ref=e222]:
        - paragraph [ref=e223]: 05 — Відгуки
        - heading "Що кажуть наші гравці" [level=2] [ref=e224]
        - paragraph [ref=e225]: Жива гра, дружня атмосфера й люди, з якими хочеться зустрічатися знову.
      - list [ref=e227]:
        - listitem [ref=e228]:
          - blockquote [ref=e229]:
            - paragraph [ref=e230]: "Який класний зал для бадмінтону! Дуже сподобався. Після гри так добре відчула все тіло, ніби нарешті його розбудила, і стільки енергії з’явилося. Прийшла додому — і так продуктивно пішов день: багато питань вирішила, добре попрацювала, і весь час була на позитиві. Ще й люди цікаві, атмосфера хороша. Буду грати."
          - generic [ref=e231]: Елена
        - listitem [ref=e232]:
          - blockquote [ref=e233]:
            - paragraph [ref=e234]: Сюди на гру в бадмінтон мене затягнула подруга, за що їй величезне спасибі! ;) Це класне місце як для захопливого спорту, так і для спілкування у дружній атмосфері. Організатори чудові люди й змогли зібрати навколо себе людей, хоч і різних за віком, але зі спільним інтересом і приємних у спілкуванні...
          - generic [ref=e235]: Юра Дудка
        - listitem [ref=e236]:
          - blockquote [ref=e237]:
            - paragraph [ref=e238]: Дуже приємне враження від самого клубу і від того, як тут загалом влаштована атмосфера навколо тенісу. Для людини, яка багато працює віддалено і годинами сидить за комп’ютером, такий формат виглядає майже ідеальною розминкою одразу і для тіла, і для голови.
          - generic [ref=e239]: Алексей Романчук
        - listitem [ref=e240]:
          - blockquote [ref=e241]:
            - paragraph [ref=e242]: Хороший клуб, ходжу сюди із задоволенням. Атмосфера дуже дружня, новачків ніхто не ображає, до кожного намагаються знайти свій підхід. Грають люди найрізноманітніших рівнів.
          - generic [ref=e243]: Nikita Popov
