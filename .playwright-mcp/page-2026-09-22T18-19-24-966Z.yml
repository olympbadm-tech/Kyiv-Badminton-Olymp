    - generic [ref=f1e219]:
      - generic [ref=f1e222]:
        - paragraph [ref=f1e223]: 05 — Відгуки
        - heading "Що кажуть наші гравці" [level=2] [ref=f1e224]
        - paragraph [ref=f1e225]: Жива гра, дружня атмосфера й люди, з якими хочеться зустрічатися знову.
      - list [ref=f1e227]:
        - listitem [ref=f1e228]:
          - blockquote [ref=f1e229]:
            - paragraph [ref=f1e230]: "Який класний зал для бадмінтону! Дуже сподобався. Після гри так добре відчула все тіло, ніби нарешті його розбудила, і стільки енергії з’явилося. Прийшла додому — і так продуктивно пішов день: багато питань вирішила, добре попрацювала, і весь час була на позитиві. Ще й люди цікаві, атмосфера хороша. Буду грати."
          - generic [ref=f1e231]: Елена
        - listitem [ref=f1e232]:
          - blockquote [ref=f1e233]:
            - paragraph [ref=f1e234]: Сюди на гру в бадмінтон мене затягнула подруга, за що їй величезне спасибі! ;) Це класне місце як для захопливого спорту, так і для спілкування у дружній атмосфері. Організатори чудові люди й змогли зібрати навколо себе людей, хоч і різних за віком, але зі спільним інтересом і приємних у спілкуванні...
          - generic [ref=f1e235]: Юра Дудка
        - listitem [ref=f1e236]:
          - blockquote [ref=f1e237]:
            - paragraph [ref=f1e238]: Дуже приємне враження від самого клубу і від того, як тут загалом влаштована атмосфера навколо тенісу. Для людини, яка багато працює віддалено і годинами сидить за комп’ютером, такий формат виглядає майже ідеальною розминкою одразу і для тіла, і для голови.
          - generic [ref=f1e239]: Алексей Романчук
        - listitem [ref=f1e240]:
          - blockquote [ref=f1e241]:
            - paragraph [ref=f1e242]: Хороший клуб, ходжу сюди із задоволенням. Атмосфера дуже дружня, новачків ніхто не ображає, до кожного намагаються знайти свій підхід. Грають люди найрізноманітніших рівнів.
          - generic [ref=f1e243]: Nikita Popov
